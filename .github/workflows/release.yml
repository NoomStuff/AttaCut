name: Release

on:
   workflow_dispatch:
   push:
      branches:
         - main
      tags:
         - "v*"

permissions:
   contents: read

concurrency:
   group: release
   cancel-in-progress: false

jobs:
   prepare:
      name: Select release and tag version changes
      runs-on: ubuntu-latest
      timeout-minutes: 5
      permissions:
         contents: write
      outputs:
         build: ${{ steps.release.outputs.build }}
         tag: ${{ steps.release.outputs.tag }}
      steps:
         - uses: actions/github-script@v9
           id: release
           with:
              script: |
                 const { owner, repo } = context.repo;
                 if (context.eventName === 'workflow_dispatch') {
                   core.setOutput('build', 'true');
                   return;
                 }
                 if (context.ref.startsWith('refs/tags/')) {
                   core.setOutput('build', 'true');
                   core.setOutput('tag', context.ref.slice('refs/tags/'.length));
                   return;
                 }
                 const versionAt = async (ref) => {
                   const { data } = await github.rest.repos.getContent({ owner, repo, path: 'package.json', ref });
                   return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8')).version;
                 };
                 const version = await versionAt(context.sha);
                 const before = context.payload.before;
                 const previous = /^0+$/.test(before) ? undefined : await versionAt(before);
                 if (typeof version !== 'string' || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
                   throw new Error(`Invalid package version: ${version}`);
                 }
                 const tag = `v${version}`;
                 let existing;
                 try {
                   existing = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data;
                 } catch (error) {
                   if (error.status !== 404) throw error;
                 }
                 if (version === previous && existing) {
                   core.info(`Version remains ${version} and ${tag} already exists; skipping release.`);
                   core.setOutput('build', 'false');
                   return;
                 }
                 if (existing) {
                   const commit = (await github.rest.repos.getCommit({ owner, repo, ref: `refs/tags/${tag}` })).data;
                   if (commit.sha !== context.sha) throw new Error(`${tag} already points to another commit. Choose a new version.`);
                   core.info(`${tag} already points to this commit.`);
                 } else {
                   core.info(`${tag} will be created after every package passes verification.`);
                 }
                 core.setOutput('build', 'true');
                 core.setOutput('tag', tag);

   checks:
      name: Checks
      needs: prepare
      uses: ./.github/workflows/verify.yml
      with:
         tag_check: true

   build:
      needs: prepare
      if: needs.prepare.outputs.build == 'true'
      uses: ./.github/workflows/package.yml

   release:
      name: Publish release
      if: needs.prepare.outputs.tag != '' && needs.checks.result == 'success' && needs.build.result == 'success'
      needs: [prepare, checks, build]
      permissions:
         contents: write
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - uses: actions/checkout@v7
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: latest
         - uses: actions/download-artifact@v8
           with:
              pattern: dist-*
              merge-multiple: true
              path: dist
         - name: Prepare update feeds
           env:
              RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
           run: bun scripts/prepare-update-feed.mjs dist dist/feed "$RELEASE_TAG"
         - name: Create draft release
           env:
              GH_TOKEN: ${{ github.token }}
              GH_REPO: ${{ github.repository }}
              RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
           run: |
              shopt -s nullglob
              assets=(dist/AttaCut-*.AppImage dist/AttaCut-*.dmg dist/AttaCut-*.zip dist/AttaCut-*.exe)
              if [ "${#assets[@]}" -ne 8 ]; then
                echo "Expected eight app downloads, found ${#assets[@]}." >&2
                exit 1
              fi
              case "${RELEASE_TAG#v}" in
                *-*) flags="--prerelease" ;;
                *) flags="" ;;
              esac
              if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]; then
                  gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
                fi
              else
                gh release create "$RELEASE_TAG" "${assets[@]}" --draft \
                  --title "AttaCut ${RELEASE_TAG#v}" \
                  --target "$GITHUB_SHA" --generate-notes $flags
              fi
         - name: Publish release
           env:
              GH_TOKEN: ${{ github.token }}
              GH_REPO: ${{ github.repository }}
              RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
           run: gh release edit "$RELEASE_TAG" --draft=false
         - name: Publish update feeds
           uses: actions/github-script@v9
           env:
              RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
           with:
              script: |
                 const fs = require('node:fs');
                 const { owner, repo } = context.repo;
                 const branch = 'updates';
                 let parent;
                 try {
                   parent = (await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` })).data.object.sha;
                 } catch (error) {
                   if (error.status !== 404) throw error;
                 }
                 const tree = await github.rest.git.createTree({
                   owner,
                   repo,
                   tree: ['latest.yml', 'latest-linux.yml', 'latest-linux-arm64.yml'].map(path => ({
                     path,
                     mode: '100644',
                     type: 'blob',
                     content: fs.readFileSync(`dist/feed/${path}`, 'utf8'),
                   })),
                 });
                 const commit = await github.rest.git.createCommit({
                   owner,
                   repo,
                   message: `Update feeds for ${process.env.RELEASE_TAG}`,
                   tree: tree.data.sha,
                   parents: [parent ?? context.sha],
                 });
                 if (parent) {
                   await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.data.sha });
                 } else {
                   await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: commit.data.sha });
                 }
