name: Isolated desktop tests
run-name: Desktop ${{ inputs.suite }} ${{ inputs.request }}

on:
   workflow_dispatch:
      inputs:
         suite:
            type: choice
            options: [ui, playback, native, all, package, release]
            required: true
         revision:
            description: Exact pushed source commit
            required: true
         target:
            type: choice
            options: [win32-x64, darwin-x64, darwin-arm64, linux-x64, linux-arm64]
            required: true
         request:
            description: Unique request identifier
            required: true

permissions:
   contents: read

jobs:
   desktop:
      runs-on: ${{ fromJSON('{"win32-x64":"windows-2025","darwin-x64":"macos-15-intel","darwin-arm64":"macos-15","linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm"}')[inputs.target] }}
      timeout-minutes: 90
      env:
         # The entire desktop is disposable. Exercise ordinary native windows.
         ATTACUT_TEST_VISIBLE: "1"
      steps:
         - uses: actions/checkout@v7
           with:
              ref: ${{ inputs.revision }}
         - uses: actions/setup-node@v6
           with:
              node-version: "24.22.1"
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: "1.4.2"
         - name: Record exact source and disposable environment
           shell: bash
           env:
              EXPECTED_REVISION: ${{ inputs.revision }}
           run: |
              test "$RUNNER_ENVIRONMENT" = github-hosted
              test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
              git rev-parse HEAD | tee source-revision.txt
              echo "Runner $RUNNER_NAME, $RUNNER_OS, $RUNNER_ARCH, $RUNNER_ENVIRONMENT" >> source-revision.txt
         - name: Cache Electron, packaging and pinned media downloads
           uses: actions/cache@v6
           with:
              path: |
                 ${{ runner.temp }}/electron-cache
                 ${{ runner.temp }}/electron-builder-cache
                 work/media-archives
              key: desktop-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'scripts/media-lock.ts') }}
              restore-keys: desktop-downloads-${{ runner.os }}-${{ runner.arch }}-
         - run: bun install --frozen-lockfile
           env:
              ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
         - run: bun scripts/provision-media.ts
         - name: Run desktop suite on Windows or macOS
           if: runner.os != 'Linux'
           env:
              DESKTOP_SUITE: ${{ inputs.suite }}
              ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
              ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
           run: bun scripts/desktop-tests.ts $env:DESKTOP_SUITE
           shell: pwsh
         - name: Run desktop suite on private Linux display and audio server
           if: runner.os == 'Linux'
           env:
              DESKTOP_SUITE: ${{ inputs.suite }}
              ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
              ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
           run: |
              sudo apt-get update
              sudo apt-get install -y xvfb pulseaudio libasound2-plugins openbox x11-utils dbus-x11
              mkdir -m 700 "$RUNNER_TEMP/attacut-pulse"
              pulseaudio -n --daemonize=yes --use-pid-file=no --exit-idle-time=-1 --log-target="file:$RUNNER_TEMP/attacut-pulse.log" --load="module-native-protocol-unix socket=$RUNNER_TEMP/attacut-pulse/native auth-anonymous=1" --load="module-null-sink sink_name=attacut_test rate=48000 channels=2"
              export PULSE_SERVER="unix:$RUNNER_TEMP/attacut-pulse/native"
              export PULSE_SINK=attacut_test
              export ALSA_CONFIG_PATH="$RUNNER_TEMP/attacut-asound.conf"
              printf 'pcm.!default { type pulse }\nctl.!default { type pulse }\n' > "$ALSA_CONFIG_PATH"
              pactl list short sinks
              xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" dbus-run-session -- bash -e -c '
                 openbox --sm-disable > /tmp/attacut-openbox.log 2>&1 &
                 for attempt in {1..100}; do
                    xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id #" && break
                    sleep 0.1
                 done
                 xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id #"
                 bun scripts/desktop-tests.ts "$DESKTOP_SUITE"
              '

         - name: Preserve results and provenance
           if: always()
           uses: actions/upload-artifact@v7
           with:
              name: desktop-${{ inputs.target }}-${{ inputs.suite }}-${{ github.run_id }}
              path: |
                 source-revision.txt
                 test-results/
              if-no-files-found: error
              retention-days: 14
