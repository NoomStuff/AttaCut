name: App checks

on:
   workflow_call:
      inputs:
         candidate_sha:
            type: string
            required: true

permissions:
   contents: read

# The media suite and the desktop UI suite are independent. Running them on separate
# runners, with the UI suite sharded, keeps the slowest of them on the critical path
# instead of their sum.
jobs:
   media:
      name: Media
      runs-on: windows-2025
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@v7
           with:
              ref: ${{ inputs.candidate_sha }}
         - uses: ./.github/actions/setup
           with:
              media: "true"
         - run: bun scripts/provision-media.ts
         - run: bun run test:media
         - name: Retain failure diagnostics
           if: failure()
           uses: actions/upload-artifact@v7
           with:
              name: diagnostics-app-checks-media
              path: test-results/
              if-no-files-found: ignore
              retention-days: 14
              overwrite: true

   ui:
      name: UI ${{ matrix.shard }}/2
      runs-on: windows-2025
      timeout-minutes: 30
      strategy:
         fail-fast: false
         matrix:
            shard: [1, 2]
      steps:
         - uses: actions/checkout@v7
           with:
              ref: ${{ inputs.candidate_sha }}
         - uses: ./.github/actions/setup
           with:
              media: "true"
         - run: bun scripts/provision-media.ts
         - run: bun run build
         - run: bun tests/create-fixtures.ts
         - run: bun x --no-install playwright test --shard=${{ matrix.shard }}/2
         - name: Retain browser retry traces
           if: always()
           continue-on-error: true
           uses: actions/upload-artifact@v7
           with:
              name: traces-app-checks-${{ matrix.shard }}
              path: test-results/**/trace.zip
              if-no-files-found: ignore
              retention-days: 14
              overwrite: true
         - name: Retain failure diagnostics
           if: failure()
           uses: actions/upload-artifact@v7
           with:
              name: diagnostics-app-checks-${{ matrix.shard }}
              path: test-results/
              if-no-files-found: ignore
              retention-days: 14
              overwrite: true
         - name: Retain updater preview
           if: always()
           uses: actions/upload-artifact@v7
           with:
              name: updater-preview-${{ matrix.shard }}
              path: test-results/update-ready.png
              if-no-files-found: ignore
              retention-days: 14
              overwrite: true
