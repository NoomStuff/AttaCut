name: App checks

on:
   workflow_call:
      inputs:
         candidate_sha:
            type: string
            required: true

permissions:
   contents: read

# The media suite and the desktop UI suite are independent. Running them on separate
# runners, with the UI suite sharded, keeps the slowest of them on the critical path
# instead of their sum.
jobs:
   # The suites test the ffmpeg and ffprobe that releases ship.
   build-media:
      uses: ./.github/workflows/media.yml
      with:
         candidate_sha: ${{ inputs.candidate_sha }}
         target: win-x64

   media:
      name: Media
      needs: build-media
      runs-on: windows-2025
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@v7
           with:
              ref: ${{ inputs.candidate_sha }}
         - uses: ./.github/actions/setup
         - uses: actions/download-artifact@v8
           with:
              name: media-win-x64
              path: work/media-build/win-x64
         - run: bun scripts/provision-media.ts --from work/media-build/win-x64
         - run: bun run test:media
         # Playback checks read the format manifest the media suite just wrote.
         - run: bun run build
         - run: bun x --no-install playwright test --project=playback
         - name: Retain failure diagnostics
           if: failure()
           uses: actions/upload-artifact@v7
           with:
              name: diagnostics-app-checks-media
              path: test-results/
              if-no-files-found: ignore
              retention-days: 14
              overwrite: true

   ui:
      name: UI ${{ matrix.shard }}/2
      needs: build-media
      runs-on: windows-2025
      timeout-minutes: 30
      strategy:
         fail-fast: false
         matrix:
            shard: [1, 2]
      steps:
         - uses: actions/checkout@v7
           with:
              ref: ${{ inputs.candidate_sha }}
         - uses: ./.github/actions/setup
         - uses: actions/download-artifact@v8
           with:
              name: media-win-x64
              path: work/media-build/win-x64
         - run: bun scripts/provision-media.ts --from work/media-build/win-x64
         - run: bun run build
         - run: bun tests/create-fixtures.ts
         - run: bun x --no-install playwright test --project=ui --project=native --shard=${{ matrix.shard }}/2
         - name: Retain browser retry traces
           if: always()
           continue-on-error: true
           uses: actions/upload-artifact@v7
           with:
              name: traces-app-checks-${{ matrix.shard }}
              path: test-results/**/trace.zip
              if-no-files-found: ignore
              retention-days: 14
              overwrite: true
         - name: Retain failure diagnostics
           if: failure()
           uses: actions/upload-artifact@v7
           with:
              name: diagnostics-app-checks-${{ matrix.shard }}
              path: test-results/
              if-no-files-found: ignore
              retention-days: 14
              overwrite: true
         - name: Retain updater preview
           if: always()
           uses: actions/upload-artifact@v7
           with:
              name: updater-preview-${{ matrix.shard }}
              path: test-results/update-ready.png
              if-no-files-found: ignore
              retention-days: 14
              overwrite: true
