name: Build candidate

on:
   workflow_call:
      inputs:
         candidate_sha:
            type: string
            required: true

permissions:
   contents: read

jobs:
   build:
      name: Build ${{ matrix.target }}
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: windows-2025, target: win-x64 }
               - { os: macos-15-intel, target: mac-x64 }
               - { os: macos-15, target: mac-arm64 }
               - { os: ubuntu-24.04, target: linux-x64 }
               - { os: ubuntu-24.04-arm, target: linux-arm64 }
      runs-on: ${{ matrix.os }}
      timeout-minutes: 45
      env:
         CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      steps:
         - uses: actions/checkout@v7
           with:
              ref: ${{ inputs.candidate_sha }}
         - uses: actions/setup-node@v6
           with:
              node-version: "24.22.1"
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: "1.4.2"
         - uses: actions/cache@v6
           with:
              path: |
                 ${{ runner.temp }}/electron-cache
                 ${{ runner.temp }}/electron-builder-cache
                 work/media-archives
              key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'scripts/media-lock.ts') }}
              restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
         - run: bun install --frozen-lockfile
           env:
              ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
              ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

         - name: Provision pinned media binaries
           run: bun scripts/provision-media.ts

         - name: Package
           run: ${{ runner.os == 'Windows' && 'bun run dist:win:all' || runner.os == 'macOS' && 'bun run dist:mac:all' || 'bun run dist' }}
           env:
              CSC_IDENTITY_AUTO_DISCOVERY: false
              ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
              ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

         - name: Retain exact candidate and verification inputs
           env:
              ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
           run: bun scripts/ci-stage.ts pack ${{ matrix.target }}
         - uses: actions/upload-artifact@v7
           with:
              name: candidate-${{ matrix.target }}
              path: work/candidate/
              if-no-files-found: error
              retention-days: 14
