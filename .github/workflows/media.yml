name: Media

# Builds AttaCut's ffmpeg and ffprobe from pinned sources. Each target's build is
# cached by its recipe, so it only rebuilds when scripts/build-media.sh or
# scripts/media-sources.json change. Dispatch it to rebuild every target directly.
on:
   workflow_dispatch:
   workflow_call:
      inputs:
         candidate_sha:
            type: string
            required: true
         target:
            type: string
            required: true

permissions:
   contents: read

jobs:
   build:
      name: Media ${{ matrix.target }}
      strategy:
         fail-fast: false
         matrix:
            target: ${{ fromJSON(inputs.target && format('["{0}"]', inputs.target) || '["win-x64","linux-x64","linux-arm64","mac-x64","mac-arm64"]') }}
      # Windows media cross-compiles on Linux with mingw-w64.
      runs-on: ${{ (matrix.target == 'win-x64' || matrix.target == 'linux-x64') && 'ubuntu-24.04' || matrix.target == 'linux-arm64' && 'ubuntu-24.04-arm' || matrix.target == 'mac-x64' && 'macos-15-intel' || 'macos-15' }}
      timeout-minutes: 90
      steps:
         - uses: actions/checkout@v7
           with:
              ref: ${{ inputs.candidate_sha || github.sha }}
         - uses: actions/setup-node@v6
           with:
              node-version: "24.22.1"
         - name: Restore the built media
           id: built
           uses: actions/cache/restore@v6.1.0
           with:
              path: work/media-build/${{ matrix.target }}
              key: media-build-${{ matrix.target }}-${{ hashFiles('scripts/build-media.sh', 'scripts/media-sources.json') }}
         - name: Restore the pinned sources
           if: steps.built.outputs.cache-hit != 'true' || matrix.target == 'linux-x64'
           id: sources
           uses: actions/cache/restore@v6.1.0
           with:
              path: work/media-sources
              key: media-sources-${{ hashFiles('scripts/media-sources.json') }}
         - name: Install build tools
           if: steps.built.outputs.cache-hit != 'true'
           shell: bash
           run: |
              if [ "$RUNNER_OS" = macOS ]; then
                 brew install nasm meson ninja autoconf automake libtool pkg-config
              else
                 sudo apt-get update
                 sudo apt-get install -y nasm meson ninja-build autoconf automake libtool pkg-config cmake xz-utils
                 if [ "${{ matrix.target }}" = win-x64 ]; then sudo apt-get install -y gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix mingw-w64-tools; fi
              fi
         - name: Build ffmpeg and ffprobe from source
           if: steps.built.outputs.cache-hit != 'true'
           run: bash scripts/build-media.sh ${{ matrix.target }}
         - name: Keep the pinned sources
           if: steps.sources.outcome == 'success' && steps.sources.outputs.cache-hit != 'true'
           uses: actions/cache/save@v6.1.0
           with:
              path: work/media-sources
              key: ${{ steps.sources.outputs.cache-primary-key }}
         - name: Keep the built media
           if: steps.built.outputs.cache-hit != 'true'
           uses: actions/cache/save@v6.1.0
           with:
              path: work/media-build/${{ matrix.target }}
              key: ${{ steps.built.outputs.cache-primary-key }}
         - name: Check the binaries run and carry every library
           if: matrix.target != 'win-x64'
           shell: bash
           run: |
              ffmpeg=work/media-build/${{ matrix.target }}/ffmpeg
              "$ffmpeg" -hide_banner -version | head -3
              for encoder in libx264 libx264rgb libx265 libvpx libvpx-vp9 libaom-av1 libopus libvorbis libmp3lame ffv1 png; do
                 "$ffmpeg" -hide_banner -h encoder=$encoder | grep -q "^Encoder $encoder" || { echo "Missing encoder $encoder" >&2; exit 1; }
              done
              "$ffmpeg" -hide_banner -h filter=zscale | grep -q "^Filter zscale" || { echo "Missing zscale" >&2; exit 1; }
              "$ffmpeg" -hide_banner -h decoder=libdav1d | grep -q "^Decoder libdav1d" || { echo "Missing libdav1d" >&2; exit 1; }
         - name: Package the corresponding sources
           if: matrix.target == 'linux-x64'
           run: |
              mkdir -p work/media-packet
              cp scripts/build-media.sh scripts/media-sources.json work/media-sources/
              (cd work/media-sources && zip -q -X -r ../media-packet/AttaCut-sources.zip $(node -p 'require("./media-sources.json").sources.map((s) => s.file).join(" ")') build-media.sh media-sources.json)
         - uses: actions/upload-artifact@v7
           with:
              name: media-${{ matrix.target }}
              path: work/media-build/${{ matrix.target }}/
              if-no-files-found: error
              retention-days: 14
         - uses: actions/upload-artifact@v7
           if: matrix.target == 'linux-x64'
           with:
              name: media-sources
              path: work/media-packet/AttaCut-sources.zip
              if-no-files-found: error
              retention-days: 14
              compression-level: 0
