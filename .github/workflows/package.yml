name: Package and verify

on:
   workflow_call:

permissions:
   contents: read

jobs:
   build:
      name: Build ${{ matrix.target }}
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: windows-2025, target: win-x64 }
               - { os: macos-15-intel, target: mac-x64 }
               - { os: macos-15, target: mac-arm64 }
               - { os: ubuntu-24.04, target: linux-x64 }
               - { os: ubuntu-24.04-arm, target: linux-arm64 }
      runs-on: ${{ matrix.os }}
      timeout-minutes: 45
      steps:
         - uses: actions/checkout@v7
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version-file: .bun-version
         - uses: actions/cache@v6
           with:
              path: |
                 ${{ runner.temp }}/electron-cache
                 ${{ runner.temp }}/electron-builder-cache
              key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
              restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
         - run: bun install --frozen-lockfile
           env:
              ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
              ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

         - name: Provision pinned media binaries
           run: bun scripts/provision-media.ts

         - name: Package
           run: bun run dist
           env:
              CSC_IDENTITY_AUTO_DISCOVERY: false
              ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
              ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

         - name: Verify packaged media and editor workflows
           run: bun run verify:package

         - name: Upload failure diagnostics
           if: failure()
           uses: actions/upload-artifact@v7
           with:
              name: diagnostics-${{ matrix.target }}
              path: |
                 test-results/
                 release/builder-debug.yml
                 release/builder-effective-config.yaml
              if-no-files-found: ignore
              retention-days: 14

         - name: Upload artifacts
           uses: actions/upload-artifact@v7
           with:
              name: dist-${{ matrix.target }}
              path: |
                 release/AttaCut-*
                 !release/*.blockmap
              if-no-files-found: error
