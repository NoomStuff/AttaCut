name: Checks

on:
   workflow_call:
      inputs:
         candidate_sha:
            type: string
            required: true

permissions:
   contents: read

jobs:
   verify:
      name: Verify
      runs-on: windows-2025
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@v7
           with:
              ref: ${{ inputs.candidate_sha }}
         - uses: ./.github/actions/setup
         - run: bun scripts/lint-workflows.ts
         - run: bun scripts/release-preflight.ts
         - run: bun run verify
