name: Release

on:
   workflow_dispatch:
   push:
      branches:
         - main
      tags:
         - "v*"

permissions:
   contents: read

env:
   BUN_VERSION: "1.4.2"

concurrency:
   group: release-${{ github.sha }}
   cancel-in-progress: false

jobs:
   prepare:
      name: Select release and tag version changes
      runs-on: ubuntu-latest
      timeout-minutes: 5
      permissions:
         contents: write
      outputs:
         build: ${{ steps.release.outputs.build }}
         tag: ${{ steps.release.outputs.tag }}
      steps:
         - uses: actions/github-script@v9
           id: release
           with:
              script: |
                 const { owner, repo } = context.repo;
                 if (context.eventName === 'workflow_dispatch') {
                   core.setOutput('build', 'true');
                   return;
                 }
                 if (context.ref.startsWith('refs/tags/')) {
                   core.setOutput('build', 'true');
                   core.setOutput('tag', context.ref.slice('refs/tags/'.length));
                   return;
                 }
                 const versionAt = async (ref) => {
                   const { data } = await github.rest.repos.getContent({ owner, repo, path: 'package.json', ref });
                   return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8')).version;
                 };
                 const version = await versionAt(context.sha);
                 const before = context.payload.before;
                 const previous = /^0+$/.test(before) ? undefined : await versionAt(before);
                 if (typeof version !== 'string' || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
                   throw new Error(`Invalid package version: ${version}`);
                 }
                 const tag = `v${version}`;
                 let existing;
                 try {
                   existing = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data;
                 } catch (error) {
                   if (error.status !== 404) throw error;
                 }
                 if (version === previous && existing) {
                   core.info(`Version remains ${version} and ${tag} already exists; skipping release.`);
                   core.setOutput('build', 'false');
                   return;
                 }
                 if (existing) {
                   const commit = (await github.rest.repos.getCommit({ owner, repo, ref: `refs/tags/${tag}` })).data;
                   if (commit.sha !== context.sha) throw new Error(`${tag} already points to another commit. Choose a new version.`);
                   core.info(`${tag} already points to this commit.`);
                 } else {
                   core.info(`${tag} will be created after every package passes verification.`);
                 }
                 core.setOutput('build', 'true');
                 core.setOutput('tag', tag);

   checks:
      name: Checks
      needs: prepare
      if: needs.prepare.outputs.build == 'true'
      runs-on: ubuntu-latest
      timeout-minutes: 15
      steps:
         - uses: actions/checkout@v7
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: ${{ env.BUN_VERSION }}
         - run: bun install --frozen-lockfile
         - name: Verify tag matches package version
           if: startsWith(github.ref, 'refs/tags/')
           run: |
              tag="${GITHUB_REF_NAME#v}"
              version="$(node -p 'require("./package.json").version')"
              if [ "$tag" != "$version" ]; then
                echo "::error::Tag ($GITHUB_REF_NAME) does not match package.json version ($version)."
                exit 1
              fi
         - name: Lint, format, test
           run: |
              bun run format:check
              bun run lint
              bun run test

   build:
      name: Build ${{ matrix.target }}
      needs: checks
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: windows-latest, platform: win32, target: win-x64 }
               - { os: macos-15-intel, platform: darwin, target: mac-x64 }
               - { os: macos-latest, platform: darwin, target: mac-arm64 }
               - { os: ubuntu-latest, platform: linux, target: linux-x64 }
               - { os: ubuntu-24.04-arm, platform: linux, target: linux-arm64 }
      runs-on: ${{ matrix.os }}
      timeout-minutes: 45
      steps:
         - uses: actions/checkout@v7
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: ${{ env.BUN_VERSION }}
         - uses: actions/cache@v6
           with:
              path: |
                 ${{ runner.temp }}/electron-cache
                 ${{ runner.temp }}/electron-builder-cache
              key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
              restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
         - run: bun install --frozen-lockfile

         - name: Provision pinned media binaries
           run: bun scripts/provision-media.ts

         - name: Package
           run: bun scripts/package-app.ts dist ${{ matrix.platform }}
           env:
              CSC_IDENTITY_AUTO_DISCOVERY: false
              ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
              ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

         - name: Verify packaged media and editor workflows
           run: bun scripts/verify-package.ts

         - name: Upload artifacts
           uses: actions/upload-artifact@v7
           with:
              name: dist-${{ matrix.target }}
              path: |
                 release/AttaCut-*
                 !release/*.blockmap
              if-no-files-found: error

   release:
      name: Publish release
      if: needs.prepare.outputs.tag != ''
      needs: [prepare, build]
      permissions:
         contents: write
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - uses: actions/download-artifact@v8
           with:
              pattern: dist-*
              merge-multiple: true
              path: dist
         - name: Create GitHub release
           env:
              GH_TOKEN: ${{ github.token }}
              GH_REPO: ${{ github.repository }}
              RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
           run: |
              case "${RELEASE_TAG#v}" in
                *-*) flags="--prerelease" ;;
                *) flags="" ;;
              esac
              gh release create "$RELEASE_TAG" dist/AttaCut-* \
                --title "AttaCut ${RELEASE_TAG#v}" \
                --target "$GITHUB_SHA" --generate-notes $flags
